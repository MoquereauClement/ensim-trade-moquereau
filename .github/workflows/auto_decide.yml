name: ENSIM Trade Center

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto_decide.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'docs/**'

concurrency:
  group: ensim-main
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.update.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - id: update
        name: Calculer et publier la décision du tour
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/update_round.py
          if ! git diff --quiet -- decision.json docs/data/observations.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add decision.json docs/data/observations.json
            git commit -m 'Actualiser la décision et le classement du marché'
            git push origin HEAD:main
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" != 'schedule' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.update.outputs.publish == 'true'
        with:
          path: docs

  dashboard:
    needs: decision
    if: needs.decision.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
